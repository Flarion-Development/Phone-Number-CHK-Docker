name: Docker Build And Push GitHub Container Registry

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: docker build -t ghcr.io/flarion-development/phone-number-chk:latest .
      - name: Push
        run: docker login -u ${{ secrets.GITHUB_USERNAME }} -p ${{ secrets.GHCR_TOKEN }}
        run: docker push ghcr.io/flarion-development/phone-number-chk:latest
      
      
